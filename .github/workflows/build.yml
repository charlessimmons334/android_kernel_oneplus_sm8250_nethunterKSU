name: KernelSU-Next SUSFS Build

on:
  push:
    branches:
      - KSU-NextSUSFS

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Proton Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-llvm
        echo "TOOLCHAIN=$(pwd)/clang-llvm" >> $GITHUB_ENV

    - name: Set environment and build config
      run: |
        export PATH=$TOOLCHAIN/bin:$PATH
        echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_ENV
        echo "DEFCONFIG=neternels_defconfig" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=charlessimmons334" >> $GITHUB_ENV

    - name: Clone patch sources
      run: |
        git clone https://github.com/JackA1ltman/NonGKI_Kernel_Patches.git -b op_kernel --depth=1
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1
        git clone https://github.com/watercatlxh/anomaly_kernel_with_ksun_susfs.git --depth=1

    - name: Apply patches
      run: |
        patch -p1 < NonGKI_Kernel_Patches/ksu_patch.diff || echo "ksu_patch already applied or failed"
        patch -p1 < NonGKI_Kernel_Patches/susfs_patch.diff || echo "susfs_patch already applied or failed"
        cp susfs4ksu/kernel_patches/fs/* fs/ || true
        cp susfs4ksu/kernel_patches/include/linux/* include/linux/ || true
        bash anomaly_kernel_with_ksun_susfs/Patches/normal_patches.sh || true

    - name: Add KernelSU-Next via setup script
      run: |
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

    - name: Apply KSU config options
      run: |
        CONFIGS=(
          CONFIG_KSU
          CONFIG_KSU_SUSFS
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          CONFIG_KSU_SUSFS_SUS_PATH
          CONFIG_KSU_SUSFS_SUS_MOUNT
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          CONFIG_KSU_SUSFS_SUS_KSTAT
          CONFIG_KSU_SUSFS_TRY_UMOUNT
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          CONFIG_KSU_SUSFS_SPOOF_UNAME
          CONFIG_KSU_SUSFS_ENABLE_LOG
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          CONFIG_KSU_SUSFS_OPEN_REDIRECT
          CONFIG_KSU_KPROBES_HOOK
          CONFIG_KSU_COMPAT_PATCH
        )
        for cfg in "${CONFIGS[@]}"; do
          echo "$cfg=y" >> arch/arm64/configs/neternels_defconfig
        done
        echo "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set" >> arch/arm64/configs/neternels_defconfig

    - name: Build Kernel
      run: |
        export PATH=$TOOLCHAIN/bin:$PATH
        make O=out ARCH=arm64 $DEFCONFIG
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CC=clang LLVM=1 LLVM_IAS=1 \
          AR=llvm-ar LD=ld.lld OBJDUMP=llvm-objdump STRIP=llvm-strip

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: built-kernel
        path: out/arch/arm64/boot/Image
