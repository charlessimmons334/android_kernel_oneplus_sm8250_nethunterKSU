name: Kernel Build (ChatGPTKSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-kernel

    timeout-minutes: 120

    env:
      ANDROID_BUILD_ROOT: /opt/android
      CCACHE_DIR: /opt/android/ccache
      CCACHE_MAXSIZE: 80G
      USE_CCACHE: "1"
      PROTON_CLANG: /opt/android/toolchains/proton-clang

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Show builder information
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "CPU threads: $(nproc)"
          free -h
          df -h /
          ccache -s

      - name: Prepare persistent directories
        run: |
          mkdir -p \
            "$ANDROID_BUILD_ROOT/toolchains" \
            "$ANDROID_BUILD_ROOT/ccache" \
            "$ANDROID_BUILD_ROOT/artifacts"

      - name: Install Proton Clang if needed
        run: |
          if [ ! -x "$PROTON_CLANG/bin/clang" ]; then
            echo "Installing Proton Clang..."
            rm -rf "$PROTON_CLANG"

            git clone \
              --depth=1 \
              https://github.com/kdrag0n/proton-clang \
              "$PROTON_CLANG"
          else
            echo "Using persistent Proton Clang:"
            "$PROTON_CLANG/bin/clang" --version | head -1
          fi

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache -z

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "$PROTON_CLANG/bin" >> "$GITHUB_PATH"

      - name: Verify build environment
        run: |
          echo "Clang:"
          clang --version | head -1

          echo
          echo "LLD:"
          ld.lld --version | head -1

          echo
          echo "ccache:"
          ccache --version | head -1

          echo
          echo "Disk:"
          df -h /

      - name: Make build script executable
        run: chmod +x kramel-build.sh

      - name: Build kernel
        run: |
          set -o pipefail
          bash kramel-build.sh 2>&1 | tee error.log

      - name: Show ccache results
        if: always()
        run: ccache -s

      - name: Verify KernelSU integration
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: $IMAGE was not produced."
            exit 1
          fi

          echo "Checking KernelSU signature in $IMAGE..."

          if strings "$IMAGE" | grep -qi ksu; then
            echo "[+] KernelSU detected."
          else
            echo "[-] KernelSU NOT found."
            exit 1
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTKSU-Zip
          path: AnyKernel3/*.zip
          if-no-files-found: error

      - name: Upload dtbo.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTKSU-dtbo
          path: AnyKernel3/dtbo.img
          if-no-files-found: ignore

      - name: Upload kernel modules
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTKSU-Modules
          path: Mod/*.zip
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Log
          path: error.log
          if-no-files-found: ignore          CONFIG_KSU_SUSFS_ENABLE_LOG
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          CONFIG_KSU_SUSFS_OPEN_REDIRECT
          CONFIG_KSU_KPROBES_HOOK
          CONFIG_KSU_COMPAT_PATCH
        )
        for cfg in "${CONFIGS[@]}"; do
          echo "$cfg=y" >> arch/arm64/configs/neternels_defconfig
        done
        echo "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set" >> arch/arm64/configs/neternels_defconfig

    - name: Build Kernel
      run: |
        export PATH=$TOOLCHAIN/bin:$PATH
        make O=out ARCH=arm64 $DEFCONFIG
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          CC=clang LLVM=1 LLVM_IAS=1 \
          AR=llvm-ar LD=ld.lld OBJDUMP=llvm-objdump STRIP=llvm-strip

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: built-kernel
        path: out/arch/arm64/boot/Image
